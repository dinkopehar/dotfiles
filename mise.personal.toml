[settings]
env_shell_expand = false
experimental = true
dotfiles.root = "~/Projects/dotfiles/personal"

[hooks]
enter = """
projects_dir="$HOME/Projects"

case "$PWD" in
  "$projects_dir"/*)
    rel="${PWD#"$projects_dir"/}"
    project="${rel%%/*}"

    [ -n "$project" ] && figlet \
      -d "$HOME/.local/share/figlet/xero-figlet-fonts" \
      -f 'ANSI Shadow' \
      "$project"
    ;;
esac
"""

# The flatpak manager is skipped when the flatpak CLI is missing, so on a fresh
# machine the flatpak entries below would need a second bootstrap run.
[bootstrap.hooks.pre-packages]
run = 'if command -v dnf >/dev/null && ! command -v flatpak >/dev/null; then sudo dnf install -y flatpak; fi'

[bootstrap.hooks.post-packages]
run = '''
if [ -r /etc/os-release ]; then
  . /etc/os-release

  if [ "${ID:-}" = "fedora" ]; then
    sudo dnf install --quiet --assumeyes @development-tools

    if ! rpm -q --quiet git-desktop-0.11.1-1; then
      git_desktop_rpm="$(mktemp --suffix=.rpm)"
      trap 'rm -f "$git_desktop_rpm"' EXIT
      curl -fL https://github.com/theBGuy/GitDesktop/releases/download/v0.11.1/GitDesktop-0.11.1-1.x86_64.rpm -o "$git_desktop_rpm"
      sudo dnf install --quiet --assumeyes "$git_desktop_rpm"
    fi
  fi
fi
'''

