# Map every Git-tracked file under personal/ to the matching path under $HOME.
[dotfiles]
"~" = { source = "~/Projects/dotfiles/personal", mode = "symlink-each" }
"~/.config/mise/config.toml" = { source = "~/Projects/dotfiles/mise.personal.toml" }

# One shared AGENTS.md for every agent.
"~/.claude/CLAUDE.md" = { source = "~/Projects/dotfiles/personal/.agents/AGENTS.md" }
"~/.claude/skills" = { source = "~/Projects/dotfiles/personal/.agents/skills", mode = "symlink-each" }
"~/.codex/skills" = { source = "~/Projects/dotfiles/personal/.agents/skills", mode = "symlink-each" }

[bootstrap.macos.defaults]
"com.apple.dock" = { "show-process-indicators" = true, "autohide" = true, "autohide-delay" = 0.2 }
"com.apple.finder" = { "EmptyTrashSecurely" = true, "CreateDesktop" = false }

# Runs after [tools] are installed, on every bootstrap, so each script is a
# no-op when its work is already done.
[tasks.bootstrap]
description = "Setup steps with no declarative equivalent"
run = [
  '''
  if ! command -v zed >/dev/null 2>&1; then
    curl -f https://zed.dev/install.sh | sh
  fi
  ''',
  "gh extension install agynio/gh-pr-review --force",
  '''
  if [ "$(uname -s)" = "Linux" ]; then
    font_dir="$HOME/.local/share/fonts/NerdFonts"
    mkdir -p "$font_dir"

    for font in JetBrainsMono FiraCode Hack Meslo D2Coding ZedMono; do
      target_dir="$font_dir/$font"

      if find "$target_dir" -type f \( -name '*.ttf' -o -name '*.otf' \) -print -quit 2>/dev/null | grep -q .; then
        continue
      fi

      archive="$(mktemp)"
      curl -fL "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/$font.zip" -o "$archive"
      mkdir -p "$target_dir"
      unzip -o "$archive" -d "$target_dir"
      rm -f "$archive"
      find "$target_dir" -type f \( -name '*.fon' -o -name '*.exe' \) -delete
    done

    fc-cache -f "$font_dir"
  fi
  ''',
  '''
  if [ "$(uname -s)" = "Linux" ] && command -v gnome-shell >/dev/null 2>&1 && command -v gnome-extensions >/dev/null 2>&1; then
    shell_version="$(gnome-shell --version | awk '{print $3}')"
    shell_version="${shell_version%%.*}"

    for extension in auto-theme-switcher@amritashan.github.io tophat@fflewddur.github.io; do
      download_url="$(curl -fsSLG \
        --data-urlencode "uuid=$extension" \
        --data-urlencode "shell_version=$shell_version" \
        https://extensions.gnome.org/extension-info/ | jq -r '.download_url')"
      archive="$(mktemp)"
      curl -fsSL "https://extensions.gnome.org$download_url" -o "$archive"
      gnome-extensions install --force "$archive"
      rm -f "$archive"
    done
  fi
  ''',
]
