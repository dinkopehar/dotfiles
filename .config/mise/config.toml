[tools]
claude-code = "latest"
codex = "latest"
"github:BurntSushi/ripgrep" = "latest"
go = "latest"
hishtory = "latest"
jq = "latest"
starship = "latest"
zoxide = "latest"
age = "latest"
github-cli = "latest"
aws = { version = "latest", symlink_bins = "true" }
uv = "latest"
"pipx:tldr" = "latest"
rust = "latest"
"npm:skills" = "latest"
node = "latest"
bun = "latest"
herdr = "latest"
"cargo:typst-cli" = "latest"
ruby = "latest"
"pipx:ty" = "latest"
"go:github.com/boyter/scc/v3" = "latest"
hcloud = "latest"
shellcheck = "latest"
"github:cosmtrek/mindwalk" = "latest"
"pipx:pdfmerge" = "latest"
crystal = "latest"
watchexec = "latest"
ollama = "latest"

[settings]
env_shell_expand = false
experimental = true
dotfiles.root = "~/Projects/dotfiles"

[hooks]
enter = """
projects_dir="$HOME/Projects"

case "$PWD" in
  "$projects_dir"/*)
    rel="${PWD#"$projects_dir"/}"
    project="${rel%%/*}"

    [ -n "$project" ] && figlet \
      -d "$HOME/.local/share/figlet/xero-figlet-fonts" \
      -f 'ANSI Shadow' \
      "$project"
    ;;
esac
"""

# The flatpak manager is skipped when the flatpak CLI is missing, so on a fresh
# machine the flatpak entries below would need a second bootstrap run.
[bootstrap.hooks.pre-packages]
run = 'if command -v dnf >/dev/null && ! command -v flatpak >/dev/null; then sudo dnf install -y flatpak; fi'

[bootstrap.hooks.post-packages]
run = '''
if [ -r /etc/os-release ]; then
  . /etc/os-release

  if [ "${ID:-}" = "fedora" ]; then
    sudo dnf install --quiet --assumeyes @development-tools
    sudo dnf install --quiet --assumeyes https://github.com/theBGuy/GitDesktop/releases/download/v0.9.6/GitDesktop-0.9.6-1.x86_64.rpm
  fi
fi
'''

[bootstrap.packages]
# Fedora build and runtime dependencies
"dnf:perl-FindBin" = "latest"
"dnf:libuuid-devel" = "latest"
"dnf:readline-devel" = "latest"
"dnf:autoconf" = "latest"
"dnf:ncurses-devel" = "latest"
"dnf:gcc-c++" = "latest"
"dnf:jemalloc-devel" = "latest"
"dnf:fuse" = "latest"
"dnf:fuse-libs" = "latest"
"dnf:figlet" = "latest"
"dnf:geos" = "latest"
"dnf:geos-devel" = "latest"
"dnf:proj" = "latest"
"dnf:proj-devel" = "latest"
"dnf:gdal" = "latest"
"dnf:gdal-devel" = "latest"
"dnf:protobuf-c" = "latest"
"dnf:protobuf-c-devel" = "latest"
"dnf:json-c" = "latest"
"dnf:json-c-devel" = "latest"
"dnf:libxml2-devel" = "latest"
"dnf:llvm" = "latest"
"dnf:openssl-devel" = "latest"
