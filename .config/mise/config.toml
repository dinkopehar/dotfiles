# macOS only: mise pours these itself, no Homebrew installation required.
"brew:bat" = { os = "macos" }
"brew:bitwarden-cli" = { os = "macos" }
"brew:cloc" = { os = "macos" }
"brew:exa" = { os = "macos" }
"brew:fish" = { os = "macos" }
"brew:fisher" = { os = "macos" }
"brew:fortune" = { os = "macos" }
"brew:httpie" = { os = "macos" }
"brew:jq" = { os = "macos" }
"brew:neovim" = { os = "macos" }
"brew:peco" = { os = "macos" }
"brew:pfetch" = { os = "macos" }
"brew:ripgrep" = { os = "macos" }
"brew:starship" = { os = "macos" }
"brew:tealdeer" = { os = "macos" }
"brew:tree-sitter" = { os = "macos" }

"brew-cask:alt-tab" = { os = "macos" }
"brew-cask:docker" = { os = "macos" }
