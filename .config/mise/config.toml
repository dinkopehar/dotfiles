[bootstrap.directories."~/Projects"]
mode = "0755"

# Font pack for the figlet banner in the enter hook above.
[bootstrap.repos]
"~/.local/share/figlet/xero-figlet-fonts" = { url = "https://github.com/xero/figlet-fonts.git" }

# Symlinks into $HOME. Sources are resolved under settings.dotfiles.root, so
# repo paths that mirror $HOME need no explicit source.
[dotfiles]
"~/.bashrc" = { mode = "symlink" }
"~/.config/starship.toml" = { mode = "symlink" }
"~/.config/zed/settings.json" = { mode = "symlink" }
"~/.config/zed/keymap.json" = { mode = "symlink" }
"~/.config/waveterm/settings.json" = { mode = "symlink" }
"~/.config/mise/config.toml" = { mode = "symlink" }
"~/.config/git/config" = { mode = "symlink" }
"~/.config/git/ignore" = { mode = "symlink" }
"~/.config/background" = { mode = "symlink" }
"~/.codex/.config.toml" = { mode = "symlink" }
"~/.codex/rules/pnpm.rules" = { mode = "symlink" }
"~/.codex/rules/nondestructive-allowlist.rules" = { mode = "symlink" }
"~/.agents/AGENTS.md" = { mode = "symlink" }

# One shared AGENTS.md for every agent. A relative source would resolve against
# .config/mise/, so these two need the repo path.
"~/.claude/CLAUDE.md" = { source = "~/Projects/dotfiles/.agents/AGENTS.md" }
"~/.codex/AGENTS.md" = { source = "~/Projects/dotfiles/.agents/AGENTS.md" }

[bootstrap.macos.defaults]
"com.apple.dock" = { "show-process-indicators" = true, "autohide" = true, "autohide-delay" = 0.2 }
"com.apple.finder" = { "EmptyTrashSecurely" = true, "CreateDesktop" = false }

# Runs after [tools] are installed, on every bootstrap, so each script is a
# no-op when its work is already done.
[tasks.bootstrap]
description = "Setup steps with no declarative equivalent"
run = [
  '''
  if ! command -v zed >/dev/null 2>&1; then
    curl -f https://zed.dev/install.sh | sh
  fi
  ''',
  "bash ~/Projects/dotfiles/scripts/05_agentic.sh",
  "bash ~/Projects/dotfiles/scripts/06_nerd_fonts.sh",
  "bash ~/Projects/dotfiles/scripts/08_ghcli.sh",
  "bash ~/Projects/dotfiles/scripts/09_gnome_extensions.sh",
]
