[tools]
uv = "latest"
"pipx:nanobot-ai" = { version = "latest", depends = ["uv"] }

[settings]
dotfiles.root = "~/Projects/dotfiles/raspberry"

[bootstrap.hooks.pre-packages]
run = '''
if [ -r /etc/os-release ]; then
  . /etc/os-release

  if [ "${ID:-}" = "debian" ]; then
    sudo rm -f /etc/apt/sources.list.d/docker.list
    sudo apt-get update
    sudo apt-get install --yes ca-certificates curl
    sudo install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/debian/gpg | sudo tee /etc/apt/keyrings/docker.asc >/dev/null
    sudo chmod a+r /etc/apt/keyrings/docker.asc
    printf 'Types: deb\nURIs: https://download.docker.com/linux/debian\nSuites: %s\nComponents: stable\nArchitectures: %s\nSigned-By: /etc/apt/keyrings/docker.asc\n' "$VERSION_CODENAME" "$(dpkg --print-architecture)" | sudo tee /etc/apt/sources.list.d/docker.sources >/dev/null
    sudo apt-get update
  fi
fi
'''

[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:docker-ce" = "latest"
"apt:docker-ce-cli" = "latest"
"apt:containerd.io" = "latest"
"apt:docker-buildx-plugin" = "latest"
"apt:docker-compose-plugin" = "latest"

[bootstrap.services.docker]
state = "running"
enabled = true

[bootstrap.linux.systemd.units.nanobot-gateway]
exec_start = "%h/.local/share/mise/shims/nanobot gateway --foreground"
restart = "on-failure"
restart_sec = "10s"
no_new_privileges = true
private_tmp = true

[bootstrap.hooks.post-tools]
run = '''
loginctl enable-linger "$USER"
systemctl --user restart dev.mise.nanobot-gateway.service
'''

[bootstrap.hooks.post-packages]
run = '''
runtipi_dir="$HOME/runtipi/runtipi"

if [ ! -x "$runtipi_dir/runtipi-cli" ]; then
  mkdir -p "$HOME/runtipi"
  cd "$HOME/runtipi"
  curl -fL https://setup.runtipi.io | sudo bash
else
  sudo "$runtipi_dir/runtipi-cli" start
fi
'''

[dotfiles]
"~/.config/mise/config.toml" = { source = "~/Projects/dotfiles/mise.raspberry.toml" }
